[project]
name = "heads-up-live-poker"
version = "0.1.0"
description = "Two-player Texas Hold'em game and multiplayer server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.165.0",
    "pydantic>=2.14.4",
    "treys==0.1.8",
    "uvicorn>=0.54.0",
    "websockets>=17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["poker", "server"]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
]
