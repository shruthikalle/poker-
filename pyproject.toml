[project]
name = "heads-up-live-poker"
version = "0.1.0"
description = "Two-player Texas Hold'em game engine"
requires-python = ">=3.11"
dependencies = [
    "treys==0.1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["poker"]
