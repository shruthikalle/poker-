[project]
name = "heads-up-live-poker"
version = "0.1.0"
description = "Two-player Texas Hold'em game and multiplayer server"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.123.10",
    "treys==0.1.8",
    "uvicorn==0.38.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["poker", "server"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
]
